# Deployment contract: RLinf Stage-1 OpenPI Pi0.5 RLT SFT — ALOHA "make a sandwich".
#
# This file is the single source of truth for serving the Stage-1 SFT model.
# The values below match
# examples/sft/config/aloha_sandwich_rlt_stage1_sft_openpi_pi05.yaml.
# Legacy checkpoints stay on the pinned legacy/main-3eeb9265 runtime.

server:
  # Bind address / port for the openpi-client WebSocket policy server.
  host: "0.0.0.0"
  port: 8001
  device: "cuda"
  # Fail on state-dict missing/unexpected keys instead of silently ignoring them.
  strict_load: true

checkpoint:
  # Accepted values are legacy and openpi_rlinf. This runtime refuses legacy.
  format: "openpi_rlinf"
  # Must contain full_weights.pt and the matching <repo_id>/norm_stats.json.
  dir: ${oc.env:ALOHA_STAGE1_CHECKPOINT}
  # Must equal the training openpi_data.repo_id; selects <repo_id>/norm_stats.json.
  repo_id: "aloha_sandwich"
  default_prompt: "make a sandwich"

model:
  action_dim: 14
  # Match the Stage-1 training checkpoint and Stage-2 feature extractor.
  precision: bf16
  num_action_chunks: 16
  num_steps: 4
  config_name: "pi05_aloha_robotwin_sandwich"
  openpi:
    config_name: "pi05_aloha_robotwin_sandwich"
    num_images_in_input: 3
    action_horizon: 16
    action_chunk: 16
    action_env_dim: 14
    train_expert_only: false
    noise_method: "flow_noise"
    model_action_dim: 32
    paligemma_variant: "gemma_2b"
    action_expert_variant: "gemma_300m"
    max_token_len: 200
    discrete_state_input: true
    noise_params: [0.16, 0.12, 200]
    joint_logprob: true
    detach_critic_input: true
    use_rlt: true
    rlt_alpha: 1.0
    rlt_prefix_seq_len: 1024
    rlt_image_only: false
    rlt_use_mask: true
