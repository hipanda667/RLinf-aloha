defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# Stage 1 only: OpenPI Pi0.5 RLT SFT.
# Training repository: /inspire/hdd/global_user/czxs253130583/fangchuan/work/RL/RLinf-worktree-rltoken-anhao
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-1

runner:
  task_type: sft
  logger:
    log_path: "/inspire/hdd/global_user/czxs253130583/fangchuan/work/RL/output/RLtoken/stage1/rlt_stage1_sft_pi05_sandwich_merged_all_0805_corrected_norm_16chunk_50k_bz16_h100_2gpu"
    project_name: rlinf-rlt
    experiment_name: "rlt_stage1_sft_pi05_sandwich_merged_all_0805_corrected_norm_16chunk_50k_bz16_h100_2gpu"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 50000
  val_check_interval: -1
  save_interval: 5000

data:
  # Final Forge-generated LeRobot v2.1 dataset root; conversion is currently in progress.
  train_data_paths: "/inspire/hdd/global_user/czxs253130583/data/lerobot-data/sandwich_merged_all_0805_v21_forge"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 16
  seed: 42

  openpi_data:
    # This asset id must match the norm_stats directory prepared under model_path.
    # Norm stats for this new dataset must be computed after conversion completes.
    repo_id: "pi05_sandwich_merged_all_0805"
    default_prompt: "make a sandwich"

  model:
    model_type: "openpi"
    precision: null
    is_lora: False
    # HDD-local copy of the pretrained checkpoint.
    model_path: "/inspire/hdd/global_user/czxs253130583/fangchuan/data/model/pi05/sft/RLinf-Pi05-LIBERO-SFT"
    action_dim: 14
    num_action_chunks: 16
    num_steps: 4
    openpi_data:
      repo_id: ${actor.openpi_data.repo_id}
      default_prompt: ${actor.openpi_data.default_prompt}

    openpi:
      config_name: "pi05_aloha_robotwin"
      num_images_in_input: 3
      # Keep the OpenPI model horizon and RLT action chunk identical.
      action_horizon: ${actor.model.num_action_chunks}
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      train_expert_only: False
      noise_method: "flow_noise"
      noise_params: [0.16, 0.12, 200]
      joint_logprob: True
      detach_critic_input: True

      # Joint SFT objective: loss = rlt_loss + rlt_alpha * vla_loss.
      use_rlt: True
      rlt_alpha: 1.0
      rlt_prefix_seq_len: 1024
      rlt_image_only: False
      rlt_use_mask: True

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 1000
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
