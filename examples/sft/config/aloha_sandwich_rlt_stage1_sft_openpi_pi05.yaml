defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0

runner:
  task_type: sft
  logger:
    log_path: ${oc.env:RLINF_OUTPUT_DIR,../results}
    project_name: rlinf-rlt
    experiment_name: "aloha_sandwich_rlt_stage1_sft_openpi_pi05"
    logger_backends: ["tensorboard"]

  max_epochs: -1
  max_steps: 50000
  val_check_interval: -1
  save_interval: 5000

data:
  # Local LeRobot dataset root containing data/ and meta/.
  train_data_paths: ${oc.env:ALOHA_DATASET_PATH}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 16
  seed: 42

  model:
    # New checkpoints use the upstream JAX-aligned PyTorch implementation.
    # Legacy OpenPI checkpoints must remain in the pinned legacy runtime.
    model_type: "openpi_rlinf"
    precision: fp32
    is_lora: False
    model_path: ${oc.env:OPENPI_MODEL_PATH}
    num_action_chunks: 16
    action_dim: 14
    num_steps: 4
    add_value_head: False
    openpi_data:
      # This id selects the matching norm_stats asset in every stage.
      repo_id: "aloha_sandwich"
      # File generated for this exact LeRobot dataset. It is copied into checkpoints.
      norm_stats_path: ${oc.env:ALOHA_NORM_STATS_PATH}
      default_prompt: "make a sandwich"

    openpi:
      task: sft
      config_name: "pi05_aloha_robotwin_sandwich"
      num_images_in_input: 3
      train_expert_only: False
      noise_method: "flow_noise"
      noise_params: [0.16, 0.12, 200]
      joint_logprob: True
      detach_critic_input: True
      action_horizon: ${actor.model.num_action_chunks}
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      discrete_state_input: True

      # Joint SFT objective: loss = rlt_loss + rlt_alpha * vla_loss.
      use_rlt: True
      rlt_alpha: 1.0
      rlt_prefix_seq_len: 1024
      rlt_image_only: False
      rlt_use_mask: True

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 1000
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32
