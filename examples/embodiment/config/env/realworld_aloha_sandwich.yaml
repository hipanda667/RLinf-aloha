env_type: realworld

total_num_envs: null

# Fail closed during adapter validation. The client owns episode reset.
auto_reset: False
ignore_terminations: False
reward_mode: raw
wrap_obs_mode: simple
seed: 0
group_size: 1
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 100
max_episode_steps: 1000

# Stage 1 camera identity and order. Do not sort these keys.
main_image_key: cam_high
wrist_image_keys:
  - cam_left_wrist
  - cam_right_wrist

keyboard_intervention_wrapper: False

video_cfg:
  save_video: False
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

init_params:
  id: "AlohaSandwichEnv-v1"
  num_envs: null

override_cfg:
  # The initial adapter is observation-only and cannot command hardware.
  is_dummy: True
  send_actions: False
  image_height: 480
  image_width: 640
  step_frequency: 25.0
  max_num_steps: 1000
  gripper_position_min: 0.0
  gripper_position_max: 0.08
  enable_human_in_loop: False
  manual_episode_control_only: False
