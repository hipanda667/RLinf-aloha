defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor:
      node_group: "4090"
      placement: 0 # Local GPU rank in the 4090 node group (n for the n+1 th GPU)
    rollout:
      node_group: "4090"
      placement: 0
  node_groups:
    - label: "4090" # GPU node group
      node_ranks: 0 # The ranks of the nodes to be included in this group， change this if your training node is not rank 0

runner:
  task_type: offline
  offline_only: true

  logger:
    log_path: "/inspire/qb-ilm/project/robot-reasoning/czxs253130583/yushun/RLinf-worktree-rltoken-anhao/results"
    project_name: rlinf-rlt
    experiment_name: "rlt_stage2_ac_mlp_sandwich_offline"
    logger_backends: ["tensorboard"]

  # OfflineRunner 必须有 max_epochs；
  # max_steps 是实际训练步数上限。
  max_epochs: 10000
  max_steps: 10000

  # 每多少步记录一次训练指标。
  log_interval: 1

  # 每 500 步保存一次 actor/critic checkpoint。
  save_interval: 500

  # 纯离线训练不启动环境评估。
  val_check_interval: -1
  eval_episodes: 0
  only_eval: false

  # 后续断点续训时填写 global_step_xxx 目录。
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 1
  group_size: 1
  agg_q: min
  actor_agg_q: q1
  enable_drq: False
  q_head_type: ${actor.model.q_head_type}

  adv_type: embodied_sac
  loss_type: rlt_ac
  loss_agg_func: "token-mean"

  # RLT Stage2 actor loss: -q_weight * Q + bc_weight * BC.
  q_weight: 0.1
  bc_weight: 5

  # Reference-action dropout on the actor input, as in RLT Stage2.
  reference_dropout_prob: 0.5

  bootstrap_type: standard
  gamma: 0.96
  tau: 0.005

  # Entropy/alpha is kept at zero; this is not standard maximum-entropy SAC.
  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    load_path: /inspire/qb-ilm/project/robot-reasoning/czxs253130583/yushun/RLinf-worktree-rltoken-anhao/results/rlt_stage2_sandwich_replay_buffer
    enable_cache: True
    cache_size: 26
    min_buffer_size: 2
    sample_window_size: 26
    auto_save: False

  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 2
  critic_actor_ratio: 4
  critic_subsample_size: 0
  backup_entropy: False


env:
  group_name: EnvGroup

rollout:
  group_name: RolloutGroup
  pipeline_stage_num: 1

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 32
  global_batch_size: 32
  seed: 1234
  enable_offload: False

  # Do not add actor.model.model_path for Stage1; this block only defines the
  # Stage2 head. Stage2 resume/load is controlled by runner.resume_dir/ckpt_path.
  model:
    model_type: "rlt_mlp_policy"

    # RLT AC defaults to fp32 for Q-learning and target-update stability.
    precision: fp32
    add_value_head: False
    add_q_head: True
    q_head_type: "default"
    fixed_std: 0.002
    is_lora: False

    # RLT Stage2 MLP input/output shape.
    z_dim: 2048
    proprio_dim: 14
    action_dim: 14
    num_action_chunks: 10
    ref_num_action_chunks: 50

  optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
