defaults:
  - env/realworld_aloha_sandwich@env.train
  - env/realworld_aloha_sandwich@env.eval
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0
    env: all
    rollout: 0-0

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:RLINF_OUTPUT_DIR,../results}
    project_name: rlinf-rlt
    experiment_name: "aloha_sandwich_rlt_stage2_online_ac_mlp"
    logger_backends: ["tensorboard"]

  max_epochs: 8000
  max_steps: -1
  only_eval: False
  weight_sync_interval: 1
  val_check_interval: -1
  save_interval: 500

  # Resume only a complete Stage-2 run. This is not the Stage-1 model path.
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 8
  group_size: 1
  agg_q: min
  actor_agg_q: q1
  enable_drq: False
  q_head_type: ${actor.model.q_head_type}

  adv_type: embodied_sac
  loss_type: rlt_ac
  loss_agg_func: "token-mean"

  q_weight: 0.1
  bc_weight: 5
  reference_dropout_prob: 0.5

  bootstrap_type: standard
  gamma: 0.96
  tau: 0.005

  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 200
    min_buffer_size: 2
    sample_window_size: 200
    auto_save: False

  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 2
  critic_actor_ratio: 4
  critic_subsample_size: 0
  backup_entropy: False

env:
  group_name: "EnvGroup"

  train:
    rollout_epoch: 1
    total_num_envs: 1
    auto_reset: False
    ignore_terminations: False
    max_episode_steps: 1000
    max_steps_per_rollout_epoch: 96
    action_dim: 14
    num_action_chunks: 16
    ref_num_action_chunks: 16

  eval:
    rollout_epoch: 1
    total_num_envs: 1
    auto_reset: False
    ignore_terminations: False
    max_episode_steps: 1000
    max_steps_per_rollout_epoch: 96
    action_dim: 14
    num_action_chunks: 16
    ref_num_action_chunks: 16
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: False

  # The synchronized Stage-2 MLP policy. Keep model_path empty for a new run.
  model:
    model_type: ${actor.model.model_type}
    model_path: ""
    precision: ${actor.model.precision}
    action_dim: ${actor.model.action_dim}
    num_action_chunks: ${actor.model.num_action_chunks}
    ref_num_action_chunks: ${actor.model.ref_num_action_chunks}
    z_dim: ${actor.model.z_dim}
    proprio_dim: ${actor.model.proprio_dim}
    add_q_head: ${actor.model.add_q_head}
    q_head_type: ${actor.model.q_head_type}
    fixed_std: ${actor.model.fixed_std}
    squash_actions: ${actor.model.squash_actions}
    is_lora: False
    lora_rank: 32

  # Frozen new-format Stage-1 model used for z_rl/proprio/ref_chunk extraction.
  rlt_feature_model:
    model_type: "openpi_rlinf"
    model_path: ${oc.env:ALOHA_STAGE1_CHECKPOINT}
    precision: bf16
    is_lora: False
    num_action_chunks: 16
    action_dim: 14
    num_steps: 4
    add_value_head: False
    openpi_data:
      repo_id: "aloha_sandwich"
      default_prompt: "make a sandwich"
    openpi:
      task: eval
      config_name: "pi05_aloha_robotwin_sandwich"
      num_images_in_input: 3
      action_horizon: ${rollout.rlt_feature_model.num_action_chunks}
      action_chunk: ${rollout.rlt_feature_model.num_action_chunks}
      action_env_dim: ${rollout.rlt_feature_model.action_dim}
      num_steps: ${rollout.rlt_feature_model.num_steps}
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 200
      discrete_state_input: True
      state_indices: []
      noise_method: "flow_noise"
      noise_params: [0.16, 0.12, 200]
      joint_logprob: True
      use_rlt: True
      rlt_prefix_seq_len: 1024
      rlt_image_only: False
      rlt_use_mask: True

  enable_torch_compile: True
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 32
  global_batch_size: 32
  seed: 1234
  enable_offload: False

  model:
    model_type: "rlt_mlp_policy"
    precision: fp32
    add_value_head: False
    add_q_head: True
    q_head_type: "default"
    fixed_std: 0.002
    # ALOHA actions are absolute joint/gripper targets, not [-1, 1] deltas.
    squash_actions: False
    is_lora: False

    z_dim: 2048
    proprio_dim: 14
    action_dim: 14
    num_action_chunks: 16
    ref_num_action_chunks: 16

  optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
