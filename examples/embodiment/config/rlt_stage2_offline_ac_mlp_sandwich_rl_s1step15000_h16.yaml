defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor:
      node_group: "4090"
      placement: 0
    rollout:
      node_group: "4090"
      placement: 0
  node_groups:
    - label: "4090"
      node_ranks: 0

runner:
  task_type: offline
  offline_only: true

  logger:
    log_path: "/inspire/hdd/global_user/czxs253130583/fangchuan/work/RL/output/RLtoken/stage2"
    project_name: rlinf-rlt
    experiment_name: "rlt_stage2_ac_mlp_sandwich_rl_s1step15000_h16_corrected_norm_unsquashed_run1"
    logger_backends: ["tensorboard"]

  max_epochs: 10000
  max_steps: 10000
  log_interval: 1
  save_interval: 500

  val_check_interval: -1
  eval_episodes: 0
  only_eval: false

  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 1
  group_size: 1
  agg_q: min
  actor_agg_q: q1
  enable_drq: false
  q_head_type: ${actor.model.q_head_type}

  adv_type: embodied_sac
  loss_type: rlt_ac
  loss_agg_func: "token-mean"

  q_weight: 0.1
  bc_weight: 5
  reference_dropout_prob: 0.5

  bootstrap_type: standard
  gamma: 0.96
  tau: 0.005

  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    load_path: /inspire/hdd/global_user/czxs253130583/fangchuan/work/RL/output/RLtoken/replay_buffer/rlt_stage2_sandwich_rl_s1step15000_h16_corrected_norm_v2
    enable_cache: true
    cache_size: 30
    min_buffer_size: 2
    sample_window_size: 30
    auto_save: false

  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 2
  critic_actor_ratio: 4
  critic_subsample_size: 0
  backup_entropy: false

env:
  group_name: EnvGroup

rollout:
  group_name: RolloutGroup
  pipeline_stage_num: 1

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 32
  global_batch_size: 32
  seed: 1234
  enable_offload: false

  model:
    model_type: "rlt_mlp_policy"

    precision: fp32
    add_value_head: false
    add_q_head: true
    q_head_type: "default"
    fixed_std: 0.002
    squash_actions: false
    is_lora: false

    z_dim: 2048
    proprio_dim: 14
    action_dim: 14
    num_action_chunks: 16
    ref_num_action_chunks: 16

  optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
