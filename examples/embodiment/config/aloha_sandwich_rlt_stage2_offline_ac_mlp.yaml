defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # Upstream actor construction queries rollout world size even though
    # pure-offline mode never launches a rollout worker.
    actor,rollout: 0-0

runner:
  task_type: "offline"
  only_eval: False
  logger:
    log_path: ${oc.env:RLINF_OUTPUT_DIR,../results}
    project_name: rlinf-rlt
    experiment_name: "aloha_sandwich_rlt_stage2_offline_ac_mlp"
    logger_backends: ["tensorboard"]

  max_epochs: 10000
  max_steps: 10000
  local_update_steps: 1
  log_interval: 1
  val_check_interval: -1
  save_interval: 500
  eval_episodes: 0

  # Resume only a complete Stage-2 global_step_<N> directory.
  resume_dir: null
  # A Stage-1 checkpoint is never loaded into the Stage-2 actor.
  ckpt_path: null

algorithm:
  update_epoch: 1
  group_size: 1
  agg_q: min
  actor_agg_q: q1
  enable_drq: False
  q_head_type: ${actor.model.q_head_type}

  adv_type: embodied_sac
  loss_type: rlt_ac
  loss_agg_func: "token-mean"

  # Offline RLT uses fixed update counts, not online ingest scheduling.
  rlt_schedule:
    enable: False

  q_weight: 0.1
  bc_weight: 5
  reference_dropout_prob: 0.5

  bootstrap_type: standard
  gamma: 0.96
  tau: 0.005

  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    load_path: ${oc.env:ALOHA_REPLAY_BUFFER_PATH}
    enable_cache: True
    cache_size: 30
    min_buffer_size: 1
    min_sample_count: 32
    sample_window_size: 30
    auto_save: False

  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 1
  critic_actor_ratio: 4
  critic_subsample_size: 0
  backup_entropy: False

env:
  group_name: "EnvGroup"

rollout:
  group_name: "RolloutGroup"
  pipeline_stage_num: 1

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 32
  global_batch_size: 32
  seed: 1234
  enable_offload: False

  model:
    model_type: "rlt_mlp_policy"
    precision: fp32
    add_value_head: False
    add_q_head: True
    q_head_type: "default"
    fixed_std: 0.002
    # ALOHA actions are absolute joint/gripper targets, not [-1, 1] deltas.
    squash_actions: False
    is_lora: False

    z_dim: 2048
    proprio_dim: 14
    action_dim: 14
    num_action_chunks: 16
    ref_num_action_chunks: 16

  optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
